[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-audio-intel"
version = "0.1.0"
description = "Local YouTube audio download, FFmpeg extraction, GPU transcription, and Ollama analysis workflow."
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2026.6.9",
  "faster-whisper>=1.2.1",
  "ctranslate2>=4.8.0",
  "requests>=2.34.2",
  "typer>=0.26.8",
  "rich>=15.0.0",
  "fastapi>=0.138.1",
  "uvicorn>=0.49.0",
  "pydantic>=2.13.4",
  "python-multipart>=0.0.32",
  "imageio-ffmpeg>=0.6.0",
  "psutil>=7.2.2",
  "nvidia-cublas-cu12>=12.9.2.10; platform_system == 'Windows'",
  "nvidia-cudnn-cu12>=9.23.2.1; platform_system == 'Windows'"
]

[project.scripts]
yai = "youtube_audio_intel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
